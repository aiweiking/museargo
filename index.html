<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的个人小站</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:#333;background:#f5f5f5;line-height:1.6}
header{background:#fff;border-bottom:1px solid #e5e5e5}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
nav{display:flex;align-items:center;gap:24px;height:56px}
nav b{font-size:18px}
nav a{color:#666;text-decoration:none;font-size:14px}
nav a:hover{color:#111}
main{padding:32px 0}
h1{font-size:24px;margin:0 0 8px}
.sub{color:#888;font-size:14px;margin:0 0 24px}
article{background:#fff;border:1px solid #e5e5e5;border-radius:8px;padding:20px;margin-bottom:16px}
article h2{font-size:17px;margin:0 0 6px}
article h2 a{color:#111;text-decoration:none}
article p{color:#666;font-size:14px;margin:0}
article time{color:#aaa;font-size:12px}
footer{border-top:1px solid #e5e5e5;padding:20px 0;color:#aaa;font-size:13px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <nav>
      <b>我的个人小站</b>
      <a href="/">首页</a>
      <a href="#articles">文章</a>
      <a href="#about">关于</a>
    </nav>
  </div>
</header>
<main>
  <div class="wrap">
    <h1>你好，欢迎来到我的小站</h1>
    <p class="sub">这里记录一些日常想法和学习笔记。</p>
    <div id="articles">
      <article>
        <h2><a href="#">最近读的一本书，简单聊聊</a></h2>
        <p>断断续续读了一个月，总算读完了，记下几点印象比较深的地方。</p>
        <time>2026-11-20</time>
      </article>
      <article>
        <h2><a href="#">周末去爬山，顺便拍了几张照片</a></h2>
        <p>天气很好，山顶的风很大，回来腿酸了两天。</p>
        <time>2026-11-15</time>
      </article>
      <article>
        <h2><a href="#">学了一点新东西，写下来防止忘记</a></h2>
        <p>把最近学到的几个小技巧整理了一下，方便以后翻出来看。</p>
        <time>2026-11-08</time>
      </article>
    </div>
    <div id="about">
      <article>
        <h2>关于这个小站</h2>
        <p>一个很小的个人页面，没事写写字，仅此而已。</p>
      </article>
    </div>
  </div>
</main>
<footer>
  <div class="wrap">© 2026 我的个人小站</div>
</footer>
</body>
</html>
